<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Heart Disease Prediction Result</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#6a11cb,#2575fc,#00c6ff,#00d4ff);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    padding:20px;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.result-card{
    width:100%;
    max-width:550px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:25px;
    padding:40px;
    text-align:center;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
    animation:fade .8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:40px;
    color:#2575fc;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
    color:white;
    margin-top:20px;
    font-size:30px;
}

.result{
    margin-top:25px;
    background:white;
    color:#2575fc;
    padding:18px;
    border-radius:15px;
    font-size:28px;
    font-weight:bold;
    box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
}

.progress{
    margin-top:25px;
    width:100%;
    height:12px;
    background:rgba(255,255,255,.3);
    border-radius:20px;
    overflow:hidden;
}

.progress span{
    display:block;
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00e676,#00c853);
    animation:loading 2s forwards;
}

@keyframes loading{
    100%{
        width:100%;
    }
}

.note{
    margin-top:20px;
    color:white;
    font-size:15px;
    line-height:24px;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:14px 35px;
    border-radius:50px;
    background:white;
    color:#2575fc;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#2575fc;
    color:white;
    transform:translateY(-4px);
}

.footer{
    margin-top:25px;
    color:white;
    opacity:.8;
    font-size:13px;
}

</style>

</head>

<body>
    <div class="result-card">
        <div class="icon">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h1>AI Heart Disease Prediction Result</h1>
        <div class="result">
            {{ prediction }}
        </div>
            <div class="progress">
                <span></span>
            </div>
                <a href="index.html" class="btn"><i class="fa-solid fa-arrow-left"></i> Go Back</a>

            <div class="footer">
                Powered by AI Healthcare System
            </div>
    </div>
</body>
</html>
